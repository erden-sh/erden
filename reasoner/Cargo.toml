[workspace]
members = ["erden-reasoner"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96.0"
license = "Apache-2.0"

[workspace.dependencies]
# purrdf hashes with blake3. Its `pure` feature builds it from Rust alone, without the C and assembly its build script
# otherwise compiles with the host's C compiler: on Windows and macOS that compiler comes with the runner image, so a
# new image changed the binary. Features unify, so this applies to purrdf's use of it on every target.
blake3 = { version = "=1.8.7", default-features = false, features = ["pure"] }
purrdf-core = { git = "https://github.com/Blackcat-Informatics/purrdf", rev = "dfb1df73199668720116dfbc737c0585e23afb5e", version = "=0.12.0" }
purrdf-entail = { git = "https://github.com/Blackcat-Informatics/purrdf", rev = "dfb1df73199668720116dfbc737c0585e23afb5e", version = "=0.12.0" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["std", "raw_value"] }
sha2 = "=0.10.9"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
