name: release

# The tools release. Three kinds of run, two of them dispatched (workflow_dispatch with a version) and one on a tag:
#
# - Engine mint, when the committed engine pins are not this checkout's build (finalize-artifacts.mjs
#   --matches-source: no mint record, or another adapter crate, lock or build flags): builds both engines on the four
#   native runners, twice each, with the cross-platform determinism check, and uploads `engine-mint`, each finalize
#   script's package metadata, anchors and record, for a pull request. Linux builds run in the digest-pinned builder
#   image and must be byte-identical; the Windows and macOS builds use the runner image's linker and system libraries,
#   which no pin covers, so a difference between their two builds or in their answers is a warning in the job summary,
#   not a failure.
# - Archive mint, when the engine pins are this checkout's build: builds no engine. Each platform's CLI archive is built
#   twice from two git archive exports with the exact pinned engine binaries, fetched from the engine mint run the
#   records name and checked against the pins, and the run uploads `release-pins` (release/pins/<version>.json, naming
#   this run as the mint run) for a pull request.
# - Release (push of tag v<version>; a canary tag v<version>-rc.<n> goes to release-canary.yml instead): builds
#   nothing. It fetches the archive artifacts of the mint run the committed
#   pins name, refuses unless every archive is byte for byte the pinned one, and only then does the publish job, the one
#   job with contents: write, create a draft release with the four archives, SHA256SUMS, install.sh and install.ps1,
#   check the uploaded assets' digests and publish it. It runs only in the public repository (named erden-sh/erden and
#   not private).
#
# GitHub keeps a run's artifacts for 90 days (this repository's maximum): an archive mint must follow its engine mint,
# and a tag its archive mint, within that time, or the mint is run again. Jobs that fetch another run's artifacts get
# actions: read for it.
on:
    workflow_dispatch:
        inputs:
            version:
                description: The version to mint (apps/cli/package.json's version)
                required: true
                type: string
    push:
        tags:
            - 'v*'
            # A release candidate is a canary, which release-canary.yml publishes as a prerelease.
            - '!v*-rc.*'

permissions:
    contents: read

jobs:
    status:
        name: engine pins status
        if: ${{ github.event_name == 'workflow_dispatch' }}
        # This is a versioned runner label; GitHub-managed runner contents are not content-addressed.
        runs-on: ubuntu-24.04
        outputs:
            pinned: ${{ steps.status.outputs.pinned }}
            reasoner-run: ${{ steps.status.outputs.reasoner-run }}
            shacl-run: ${{ steps.status.outputs.shacl-run }}
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: .node-version
            - name: Whether the committed engine pins are this checkout's build
              id: status
              shell: bash
              run: |
                  if node reasoner/qualification/finalize-artifacts.mjs --matches-source && node shacl/qualification/finalize-artifacts.mjs --matches-source; then
                      echo "pinned=true" >> "$GITHUB_OUTPUT"
                      echo "reasoner-run=$(node -p "require('./reasoner/qualification/mint.json').workflowRunId")" >> "$GITHUB_OUTPUT"
                      echo "shacl-run=$(node -p "require('./shacl/qualification/binary-reproducibility.json').workflowRunId")" >> "$GITHUB_OUTPUT"
                  else
                      echo "pinned=false" >> "$GITHUB_OUTPUT"
                  fi

    reasoner:
        needs: status
        if: ${{ github.event_name == 'workflow_dispatch' && needs.status.outputs.pinned != 'true' }}
        uses: ./.github/workflows/reasoner-build.yml
        with:
            commit: ${{ github.sha }}

    shacl:
        needs: status
        if: ${{ github.event_name == 'workflow_dispatch' && needs.status.outputs.pinned != 'true' }}
        uses: ./.github/workflows/shacl-build.yml
        with:
            commit: ${{ github.sha }}

    engines:
        name: engine pins
        needs: [status, reasoner, shacl]
        if: ${{ github.event_name == 'workflow_dispatch' && needs.status.outputs.pinned != 'true' }}
        # This is a versioned runner label; GitHub-managed runner contents are not content-addressed.
        runs-on: ubuntu-24.04
        outputs:
            pinned: ${{ steps.check.outputs.pinned }}
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
              with:
                  version: 10.15.0
                  run_install: false
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: .node-version
            # Every artifact of this run so far, each in its own folder: reasoner-<target>, shacl-<target>, and the
            # determinism comparisons.
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  path: engines
            # Each finalize script writes its packages' pins from the built binaries, for the engine-pins pull request.
            - name: Compare the built engines with the committed pins
              id: check
              shell: bash
              run: |
                  node reasoner/qualification/finalize-artifacts.mjs --artifacts engines --determinism engines/determinism-comparison --run-id "$GITHUB_RUN_ID"
                  node shacl/qualification/finalize-artifacts.mjs --artifacts engines --determinism engines/shacl-determinism-comparison --run-id "$GITHUB_RUN_ID"
                  changed=$(git status --porcelain -- reasoner shacl ':!reasoner/*/bin' ':!shacl/*/bin' ':!reasoner/qualification/mint.json' ':!shacl/qualification/binary-reproducibility.json')
                  if [ -z "$changed" ]; then echo "pinned=true" >> "$GITHUB_OUTPUT"; exit 0; fi
                  echo "pinned=false" >> "$GITHUB_OUTPUT"
                  git status --porcelain -- reasoner shacl
                  # New platform package versions and optional dependencies change the lockfile's importers.
                  pnpm install --lockfile-only --ignore-scripts
                  mkdir -p engine-mint
                  git diff --name-only -- reasoner shacl pnpm-lock.yaml | tar -cf engine-mint/changed.tar -T -
                  git ls-files --others --exclude-standard -- reasoner shacl | tar -rf engine-mint/changed.tar -T -
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              if: ${{ steps.check.outputs.pinned == 'false' }}
              with:
                  name: engine-mint
                  path: engine-mint/
                  if-no-files-found: error

    archive:
        name: archive ${{ matrix.platform }}
        needs: status
        if: ${{ github.event_name == 'workflow_dispatch' && needs.status.outputs.pinned == 'true' }}
        permissions:
            contents: read
            actions: read
        strategy:
            fail-fast: false
            matrix:
                include:
                    # These are versioned runner labels; GitHub-managed runner contents are not content-addressed.
                    - platform: linux-x64
                      target: x86_64-unknown-linux-gnu
                      runner: ubuntu-24.04
                    - platform: linux-arm64
                      target: aarch64-unknown-linux-gnu
                      runner: ubuntu-24.04-arm
                    - platform: darwin-arm64
                      target: aarch64-apple-darwin
                      runner: macos-15
                    - platform: win32-x64
                      target: x86_64-pc-windows-msvc
                      runner: windows-2025
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
              with:
                  version: 10.15.0
                  run_install: false
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: .node-version
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml
            # Fills the store the archive builds install from offline.
            - run: pnpm install --frozen-lockfile --ignore-scripts
            # The exact engine binaries the engine mint built and the pins name; build-cli-archive.mjs checks each
            # against its pin before it is used.
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  name: reasoner-${{ matrix.target }}
                  path: engines/reasoner
                  run-id: ${{ needs.status.outputs.reasoner-run }}
                  github-token: ${{ github.token }}
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  name: shacl-${{ matrix.target }}
                  path: engines/shacl
                  run-id: ${{ needs.status.outputs.shacl-run }}
                  github-token: ${{ github.token }}
            - name: Download the pinned Node.js runtime
              shell: bash
              run: |
                  file=$(node -p "require('./release/node-runtime.json').platforms['${{ matrix.platform }}'].file")
                  base=$(node -p "require('./release/node-runtime.json').baseUrl")
                  curl -fsSL --retry 3 -A 'erden-release/1' -o "$RUNNER_TEMP/$file" "$base$file"
                  echo "NODE_ARCHIVE=$RUNNER_TEMP/$file" >> "$GITHUB_ENV"
            - name: Build the archive twice, compare, and run it
              shell: bash
              run: |
                  exe=""; if [ "${{ matrix.platform }}" = win32-x64 ]; then exe=".exe"; fi
                  node release/build-cli-archive.mjs --node "$NODE_ARCHIVE" \
                      --reasoner "engines/reasoner/${{ matrix.target }}/erden-reasoner$exe" \
                      --shacl "engines/shacl/${{ matrix.target }}/erden-shacl$exe" --out release-build
            # The install script for this archive, offline (--archive), then doctor, init, check and pack on the demo,
            # and a reasoner changed by one byte refused. On Linux this runs in a container with no network.
            - name: Install the archive offline and run it
              shell: bash
              run: |
                  record="release-build/${{ matrix.platform }}.json"
                  file=$(node -p "require('./$record').archive.file")
                  container=""; if [ "$RUNNER_OS" = Linux ]; then container="--container"; fi
                  node release/test-install.mjs --archive "release-build/$file" --record "$record" $container
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: archive-${{ matrix.platform }}
                  path: release-build/
                  if-no-files-found: error

    pins:
        name: release pins
        needs: archive
        if: ${{ github.event_name == 'workflow_dispatch' }}
        # This is a versioned runner label; GitHub-managed runner contents are not content-addressed.
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: .node-version
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  pattern: archive-*
                  merge-multiple: true
                  path: release-build
            - name: Mint the pins, naming this run as the one whose archives a tag publishes
              shell: bash
              run: |
                  version=$(node -p "require('./apps/cli/package.json').version")
                  if [ "$version" != "${{ inputs.version }}" ]; then echo "apps/cli is $version, not ${{ inputs.version }}"; exit 1; fi
                  node release/pins.mjs mint --artifacts release-build --out release-pins --run-id "$GITHUB_RUN_ID"
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: release-pins
                  path: release-pins/
                  if-no-files-found: error

    published-archives:
        name: the mint's archives
        if: ${{ github.event_name == 'push' }}
        # This is a versioned runner label; GitHub-managed runner contents are not content-addressed.
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            actions: read
        outputs:
            mint-run: ${{ steps.mint.outputs.run }}
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: .node-version
            - name: The mint run the committed pins name
              id: mint
              shell: bash
              run: echo "run=$(node release/pins.mjs mint-run --version "${GITHUB_REF_NAME#v}")" >> "$GITHUB_OUTPUT"
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  pattern: archive-*
                  merge-multiple: true
                  path: release-build
                  run-id: ${{ steps.mint.outputs.run }}
                  github-token: ${{ github.token }}
            - name: Refuse anything but the pinned bytes
              run: node release/pins.mjs verify --artifacts release-build --release --tag "$GITHUB_REF_NAME"

    publish:
        name: publish
        needs: published-archives
        # Only the public repository publishes: a private copy of it never does, whatever it is named.
        if: ${{ github.event_name == 'push' && github.repository == 'erden-sh/erden' && github.event.repository.private == false }}
        # This is a versioned runner label; GitHub-managed runner contents are not content-addressed.
        runs-on: ubuntu-24.04
        permissions:
            contents: write
            actions: read
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version-file: .node-version
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  pattern: archive-*
                  merge-multiple: true
                  path: release-build
                  run-id: ${{ needs.published-archives.outputs.mint-run }}
                  github-token: ${{ github.token }}
            # The same check as the job before, on the bytes this job publishes.
            - name: Refuse anything but the pinned bytes
              run: node release/pins.mjs verify --artifacts release-build --release --tag "$GITHUB_REF_NAME"
            - name: Assemble the assets
              shell: bash
              run: node release/assemble-assets.mjs --artifacts release-build --version "${GITHUB_REF_NAME#v}" --out assets
            - name: Create a draft release, check the uploaded assets, then publish it
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Erden ${GITHUB_REF_NAME#v}" --notes-file assets/RELEASE-NOTES.md assets/erden-* assets/SHA256SUMS assets/install.sh assets/install.ps1
                  mkdir uploaded
                  gh release download "$GITHUB_REF_NAME" --dir uploaded
                  (cd uploaded && sha256sum -c ../assets/SHA256SUMS)
                  gh release edit "$GITHUB_REF_NAME" --draft=false

    # Installs the release just published from its own assets, on every platform.
    verify:
        name: verify the published release
        needs: publish
        uses: ./.github/workflows/verify-release.yml
        with:
            tag: ${{ github.ref_name }}
